<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>插头学堂 · 工作台</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
</head>
<body>

<!-- 登录 / 初始化 -->
<div class="gate" id="gate" hidden>
  <form class="gate-card" id="gateForm">
    <div class="brand">
      <svg viewBox="0 0 48 48" class="brand-mark" aria-hidden="true">
        <rect x="4" y="4" width="40" height="40" rx="12" fill="#FA2D48"/>
        <path d="M18 14v10a6 6 0 0 0 12 0V14" stroke="#fff" stroke-width="3.2" fill="none" stroke-linecap="round"/>
        <path d="M24 30v6" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/>
      </svg>
      <div>
        <div class="brand-name">插头学堂</div>
        <div class="brand-sub">Plugglearn Console</div>
      </div>
    </div>
    <h1 id="gateTitle">登录工作台</h1>
    <p class="gate-hint" id="gateHint">用管理员账号进入，管理账号、计划、任务与记录。</p>
    <label class="field"><span>邮箱</span><input type="email" id="gateEmail" autocomplete="username" required placeholder="admin@example.com"></label>
    <label class="field"><span>密码</span><input type="password" id="gatePass" autocomplete="current-password" required placeholder="至少 8 位"></label>
    <button class="btn primary block" type="submit" id="gateSubmit">登录</button>
    <p class="gate-error" id="gateError" hidden></p>
  </form>
</div>

<!-- 主界面 -->
<div class="shell" id="shell" hidden>
  <aside class="sidebar">
    <div class="brand small">
      <svg viewBox="0 0 48 48" class="brand-mark" aria-hidden="true">
        <rect x="4" y="4" width="40" height="40" rx="12" fill="#FA2D48"/>
        <path d="M18 14v10a6 6 0 0 0 12 0V14" stroke="#fff" stroke-width="3.2" fill="none" stroke-linecap="round"/>
        <path d="M24 30v6" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/>
      </svg>
      <div>
        <div class="brand-name">插头学堂</div>
        <div class="brand-sub">Plugglearn Console</div>
      </div>
    </div>

    <nav class="nav" id="nav">
      <a class="nav-item" href="#/overview" data-route="overview"><span class="nav-ico"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg></span>概览</a>
      <a class="nav-item" href="#/accounts" data-route="accounts"><span class="nav-ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c.6-4 3.8-6.2 7.5-6.2S19 16 19.5 20"/></svg></span>账号</a>
      <a class="nav-item" href="#/plans" data-route="plans"><span class="nav-ico"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></span>计划</a>
      <a class="nav-item" href="#/tasks" data-route="tasks"><span class="nav-ico"><svg viewBox="0 0 24 24"><path d="M4 6.5l2.2 2.2L10 5M4 15l2.2 2.2L10 13.5M13 7.5h7M13 16h7"/></svg></span>任务</a>
      <a class="nav-item" href="#/records" data-route="records"><span class="nav-ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.2V12l3.4 2"/></svg></span>记录</a>
      <a class="nav-item" href="#/orders" data-route="orders"><span class="nav-ico"><svg viewBox="0 0 24 24"><path d="M5.5 4h13l-1 16.5H6.5L5.5 4z"/><path d="M9 8.5h6"/></svg></span>订单</a>
      <a class="nav-item" href="#/settings" data-route="settings"><span class="nav-ico"><svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h14"/><circle cx="9" cy="7" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="8" cy="17" r="2"/></svg></span>设置</a>
    </nav>

    <div class="sidebar-foot">
      <div class="queue-pill" id="queuePill"><span class="dot"></span><span id="queueText">调度器空闲</span></div>
      <button class="btn ghost tiny" id="pauseBtn">暂停调度</button>
      <div class="who" id="who"></div>
      <button class="btn ghost tiny" id="logoutBtn">退出登录</button>
    </div>
  </aside>

  <main class="main" id="main"></main>
</div>

<div class="toast" id="toast" hidden></div>
<div class="modal-wrap" id="modal" hidden><div class="modal" id="modalBody"></div></div>

<script src="/admin.js"></script>
</body>
</html>
